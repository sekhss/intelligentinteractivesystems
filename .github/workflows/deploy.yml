name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "11 * * * *"   # hourly: picks up edits made in the Google Sheet
  workflow_dispatch:        # the "Run workflow" button, 

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull the latest content from the Google Sheet
        run: node scripts/sync-sheet.mjs
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
      - name: Build the site
        run: node build.mjs
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
          EDIT_PASSWORD: ${{ secrets.EDIT_PASSWORD }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
