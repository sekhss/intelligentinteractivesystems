name: Weekly ORCID update

# Every Monday: read the lab members' ORCID iDs from the sheet, add any new papers to content/papers-auto.json,
# commit that file, and ask the deploy workflow to republish. (Pushes made with the built-in token don't start
# other workflows by themselves, hence the explicit "gh workflow run" at the end.)
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: orcid

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read the current people from the Google Sheet
        run: node scripts/sync-sheet.mjs
        env:
          SHEET_ID: ${{ vars.SHEET_ID }}
      - name: Fetch new papers from ORCID
        run: node scripts/fetch-orcid.mjs
      - name: Commit the new papers and republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp content/papers-auto.json "$RUNNER_TEMP/papers-auto.json"
          git checkout -- .                      # drop the sheet-synced files; only papers-auto.json is ours to commit
          cp "$RUNNER_TEMP/papers-auto.json" content/papers-auto.json
          if git diff --quiet -- content/papers-auto.json; then echo "No new papers this week."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/papers-auto.json
          git commit -m "ORCID: add new papers"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
